name: dry-run
on: [push, pull_request]
jobs:
  mock-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy matplotlib
      - name: Run both conditions with the mock LLM
        env:
          RSI_MOCK: "1"
        run: |
          python run_experiment.py --condition fixed --rounds 3 --n-dev 20 --n-test 40 --synthetic --out runs_ci
          python run_experiment.py --condition recursive --rounds 3 --n-dev 20 --n-test 40 --synthetic --out runs_ci
          python analyze.py --runs runs_ci --out figures_ci
